<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors
    </p>

    <button onclick="
      playGame('rock')
    " class="move-button"
    ><img src="images/rock-emoji.png" 
      class="move-icon">
    </button>

    <button onclick="
      playGame('paper')  
    " class="move-button"
    ><img src="images/paper-emoji.png" 
      class="move-icon">
    </button>
    
    <button onclick="
      playGame('scissors');
    " class="move-button"
    ><img src="images/scissors-emoji.png" 
      class="move-icon">
    </button>

    <p class="js-result result"></p>

    <p class="js-moves"></p>

    <p class="js-score score"> </p>

    <div>
    <button class="reset-score-button" onclick="
      scoreReset()
    ">Reset Score</button>

    <button class="auto-play-button" onclick="
      autoPlay();
    ">Auto Play</button>

    <span class="js-enter-speed"></span>

    <p class="js-auto-play-speed"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
